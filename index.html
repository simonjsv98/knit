<style>
/* Same build as RECIPES: fixed top bar, one scrolling area per page, sheets from the bottom, a fixed button at the bottom. */
:root {
  --bg: #F3F2EF; --surface: #FBFAF8; --ink: #1B1A18; --muted: #7A776F; --line: #DEDCD6;
  --cover: #4A2212; --on-cover: #F9E27D; --accent: #4A2212; --dot: #F2C94C;
  --font: "Google Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.45; overflow: hidden; -webkit-text-size-adjust: 100%; }
#app { position: relative; z-index: 1; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, p, ul, ol { margin: 0; padding: 0; list-style: none; }
.gutter { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 600px; margin-inline: auto; width: 100%; }
[hidden] { display: none !important; }
.view { height: 100%; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }

/* Top bar: back link to the left, update or home in the middle, the glossary to the right */
.top-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; padding-top: env(safe-area-inset-top, 0px); background: #F3F2EF; border-bottom: 1px solid var(--line); }
.top-bar + .scroll { margin-top: calc(57px + env(safe-area-inset-top, 0px)); }
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; min-height: 56px; }
.top > :last-child { justify-self: end; }
.wordmark { font: 600 1.15rem/1 var(--font); letter-spacing: .04em; }
.link { min-height: 44px; display: flex; align-items: center; min-width: 0; font-weight: 500; }
.link span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.top-link { min-height: 44px; display: flex; align-items: center; font-weight: 500; color: var(--accent); }
.icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
.icon-btn svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
/* iOS 26 blurs the top edge of home screen apps unless a fixed, opaque, full-width element sits there. */
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: max(env(safe-area-inset-top, 0px), 2px); background: #F3F2EF; z-index: 30; }

/* Start page: one colour tile */
.home-scroll { display: flex; }
.home-tiles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding-block: 12px calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 900px; margin-inline: auto; }
.tile { position: relative; flex: 1; min-height: 240px; width: 100%; border-radius: 20px; overflow: hidden; background: var(--cover); color: var(--on-cover); transition: transform .16s var(--ease); }
.tile:active { transform: scale(.98); }
.tile svg { position: absolute; top: 3%; right: -4%; height: 78%; width: 104%; }
.tile-label { position: absolute; left: 20px; bottom: 16px; display: flex; flex-direction: column; }
.tile-name { font: 600 2.1rem/1.05 var(--font); letter-spacing: .01em; }
.tile-count { font-size: .95rem; margin-top: 4px; opacity: .85; }

/* Pattern list, like a section page in RECIPES */
.home-title { font: 500 1.9rem/1.2 var(--font); padding-block: 16px 32px; color: var(--accent); }
.home-title::after { content: ""; display: inline-block; width: .42em; height: .42em; margin-left: .3em; border-radius: 50%; background: var(--dot); vertical-align: .08em; }
.patterns button { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; width: 100%; padding-block: 16px; border-top: 1px solid var(--line); font-size: 1.15rem; line-height: 1.3; transition: opacity .12s; }
.patterns li:last-child > * { border-bottom: 1px solid var(--line); }
.patterns .hit { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.patterns .where { font-size: .85rem; color: var(--muted); }
.patterns .mark { color: var(--accent); flex: none; transition: transform .2s var(--ease); }
.patterns button:active { opacity: .45; }
@media (hover: hover) { .patterns button:hover .mark { transform: translateX(3px); } }
.more-soon { color: var(--muted); font-size: .95rem; padding-block: 14px 40px; }

/* Guide pages */
.title { font: 500 clamp(1.7rem, 7.4vw, 2.3rem)/1.2 var(--font); text-wrap: balance; padding-top: 16px; }
.intro { color: var(--muted); margin-top: 12px; font-size: 1rem; }
.intro b { color: var(--ink); font-weight: 600; }
.page { padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
.label { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.block-label { margin-top: 40px; padding-bottom: 8px; color: var(--accent); }
.hint { color: var(--muted); font-size: .95rem; padding-bottom: 14px; }
.group-label { margin-top: 26px; padding-bottom: 6px; display: flex; align-items: baseline; gap: 10px; }

/* Progress through the pages: one segment per stage */
.progress { display: flex; gap: 4px; padding-top: 16px; }
.progress span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s var(--ease); }
.progress span.on { background: var(--accent); }
.eyebrow { margin-top: 18px; color: var(--accent); }
.eyebrow + .title { padding-top: 6px; }

.chips { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.chip { min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid var(--line); display: inline-flex; align-items: center; font-size: 1.05rem; transition: transform .16s var(--ease), background .16s, color .16s; }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:disabled { opacity: .35; }

.ing { display: grid; grid-template-columns: 6.2em minmax(0, 1fr); gap: 10px; padding-block: 9px; line-height: 1.35; width: 100%; }
.ing + .ing { border-top: 1px solid var(--line); }
.ing .amt { font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ing .more { color: var(--muted); font-size: .9rem; display: block; }
.ing .more::after { content: " ›"; }
button.ing { transition: opacity .12s; }
button.ing:active { opacity: .45; }
button.ing .amt { color: var(--accent); }
.ing.current .amt, .ing.current span { color: var(--accent); font-weight: 600; }

/* Overview of the stages on the start page */
.plan-list li + li { border-top: 1px solid var(--line); }
.plan-list button { display: grid; grid-template-columns: 1.7em minmax(0, 1fr) auto; gap: 6px; align-items: baseline; width: 100%; padding-block: 12px; font-size: 1.1rem; transition: opacity .12s; }
.plan-list button:active { opacity: .45; }
.plan-list .no { color: var(--accent); font-weight: 600; font-size: .95rem; }
.plan-list button::after { content: "›"; color: var(--accent); }

.steps { display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 1.7em minmax(0, 1fr); gap: 6px; padding-block: 20px; border-top: 1px solid var(--line); cursor: pointer; transition: opacity .15s; }
.step .no { font-size: .95rem; line-height: 1.9rem; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.step .text { font-size: clamp(1.2rem, 5.2vw, 1.4rem); line-height: 1.4; min-width: 0; transition: opacity .12s; }
.step:active .text { opacity: .6; }
.step .text b { font-weight: 600; color: var(--accent); }
.step .aside { display: block; font-size: 1rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.step.done { opacity: .32; }
.term { font-weight: 600; color: var(--accent); text-decoration: underline dotted; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.inferred { display: inline-block; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; margin-top: 8px; }

/* Where you are in the counting, opens the row counter */
.status { display: block; width: 100%; margin-top: 18px; padding: 12px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 1rem; line-height: 1.4; transition: transform .16s var(--ease); }
.status:active { transform: scale(.98); }
.status b { font-weight: 600; color: var(--accent); }
.status-top { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .9rem; }
.status-main { display: block; margin-top: 2px; }

/* Row diagram: the parts of the row in the order you knit them, numbered like the steps below */
.diagram { margin-top: 20px; padding: 14px 12px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.diagram-cap { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
.strip { display: flex; gap: 3px; align-items: flex-start; }
.seg { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: none; transition: opacity .2s; }
.seg.grow { flex: 1 1 0; min-width: 0; align-items: stretch; }
.seg-blocks { display: flex; gap: 3px; height: 34px; width: 100%; justify-content: center; transition: opacity .2s; }
.b { height: 34px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: .78rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.b-st, .b-run { border: 1.5px solid var(--accent); color: var(--accent); background: var(--bg); }
.b-st { width: 22px; }
.b-run { flex: 1 1 0; min-width: 30px; padding: 0 4px; }
.b-dec { width: 31px; font-size: .72rem; letter-spacing: -.02em; background: var(--cover); color: var(--on-cover); }
.b-mid { min-width: 24px; padding: 0 5px; border-radius: 13px; background: var(--dot); color: var(--ink); }
.b-mk { width: 4px; margin: 0 3px; border-radius: 2px; background: var(--ink); }
.seg .n { height: 22px; font-size: .78rem; font-weight: 600; color: var(--accent); text-align: center; font-variant-numeric: tabular-nums; }
.seg .n span { display: inline-block; min-width: 22px; height: 22px; line-height: 22px; border-radius: 11px; transition: background .2s, color .2s; }
.seg.off { opacity: .3; }
.seg.done .seg-blocks, .seg.done .n { opacity: .32; }
.seg.now .n span { background: var(--dot); color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: .82rem; color: var(--muted); }
.legend i { display: inline-block; width: 13px; height: 13px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; }
.legend .l-st { border: 1.5px solid var(--accent); }
.legend .l-dec { background: var(--cover); }
.legend .l-mid { background: var(--dot); border-radius: 50%; }
.legend .l-mk { width: 4px; background: var(--ink); border-radius: 2px; }

.note { padding-block: 14px; border-top: 1px solid var(--line); font-size: 1.02rem; }
.note b { font-weight: 600; }
.original { margin-top: 10px; padding: 16px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); font-size: .98rem; white-space: pre-line; }
.warn { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: #FBF1C9; font-size: 1rem; }
.warn b { font-weight: 600; }

/* Bottom bar: back and the next action */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding-top: 12px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); pointer-events: none; }
.dock-row { display: flex; gap: 10px; }
.dock-back { pointer-events: auto; flex: 0 0 60px; height: 60px; border-radius: 30px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; transition: transform .16s var(--ease); }
.dock-back:active { transform: scale(.94); }
.dock-back svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.big { pointer-events: auto; flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 60px; border-radius: 30px; background: var(--cover); color: var(--on-cover); font-weight: 600; font-size: 1.1rem; text-align: center; transition: transform .16s var(--ease), opacity .16s; }
.big:active { transform: scale(.97); opacity: .88; }
.big.dark { background: var(--ink); color: var(--bg); }
.big:disabled { opacity: .3; }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(10, 10, 8, .4); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 88%; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .scroll { padding-bottom: 12px; }
.sheet-title { font: 500 1.15rem/1.2 var(--font); padding-block: 20px 4px; }
.sheet-foot { padding-top: 12px; padding-bottom: 16px; }
.sheet .group-label:first-child { margin-top: 8px; }
.sheet ol.how { counter-reset: n; }
.sheet ol.how li { counter-increment: n; display: grid; grid-template-columns: 1.7em 1fr; gap: 6px; padding-block: 12px; border-top: 1px solid var(--line); font-size: 1.1rem; }
.sheet ol.how li::before { content: counter(n); color: var(--accent); font-weight: 600; font-size: .95rem; line-height: 1.6rem; }
.sheet p { margin-top: 10px; font-size: 1rem; }
.sheet p.muted { color: var(--muted); }

/* Counter */
.counter-row { font: 500 clamp(1.6rem, 7vw, 2rem)/1.15 var(--font); margin-top: 6px; }
.counter-side { color: var(--muted); font-size: 1rem; margin-top: 4px; }
.big-btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 60px; border-radius: 30px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 1.1rem; margin-top: 22px; transition: transform .16s var(--ease); }
.big-btn:active { transform: scale(.97); }
.big-btn:disabled { opacity: .3; }
.small-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

/* Motion, as in RECIPES: short, one curve. Page changes swap at once with a short fade; no sliding pages, which stutter on phones. */
.settled, .settled * { animation: none !important; }
#app, #app * { touch-action: pan-y pinch-zoom; }
.enter-f > .scroll, .enter-b > .scroll { animation: page-in .16s ease-out; }
@keyframes page-in { from { opacity: 0; } }
.sheet-wrap { animation: fade-in .2s ease-out; }
.sheet { animation: sheet-in .32s var(--ease); }
.sheet-wrap.closing { animation: fade-out .2s ease-in forwards; }
.sheet-wrap.closing .sheet { animation: sheet-out .2s ease-in forwards; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes sheet-in { from { transform: translateY(100%); } }
@keyframes sheet-out { to { transform: translateY(100%); } }
/* Update: a yellow circle grows from the button, and shrinks back into it once the new version has loaded. The hold covers the reload itself. */
.update-wipe { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #4A2212; font-size: 1.7rem; font-weight: 500; letter-spacing: .02em; }
.update-wipe b { position: absolute; border-radius: 50%; background: #F9E27D; will-change: transform; }
.update-wipe span { position: relative; }
html.wipe-hold::after { content: "KNIT"; position: fixed; left: 0; right: 0; bottom: 0; top: var(--wipe-top, 0px); z-index: 29; background: #F9E27D; color: #4A2212; display: flex; align-items: center; justify-content: center; font: 500 1.7rem "Google Sans", -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .02em; }
.icon-btn.updating svg { animation: update-spin .8s linear infinite; }
@keyframes update-spin { to { transform: rotate(360deg); } }
/* Swipe back: the current page lifts off and follows the finger, the previous page waits underneath. */
.swipe-top { position: fixed; inset: 0; z-index: 5; background: var(--bg); display: flex; flex-direction: column; will-change: transform; pointer-events: none; }
.swipe-top::before { content: ""; position: absolute; top: 0; bottom: 0; left: -14px; width: 14px; background: linear-gradient(to left, rgba(20, 18, 10, .14), transparent); }
#app.swiping { will-change: transform; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app" class="view"></div>
<div id="sheet" class="sheet-wrap" hidden></div>

<script>
/* All instructions come from the pattern text Simon pasted. Where the guide adds something the pattern does not say,
   it is marked "Står inte i mönstret" in the page and explained under Bra att veta. */
const PATTERN = `Lägg upp 116 (316) maskor
Markera mitten maskan genom att sätta markörer på varsin sida om den.
Varv 1 (avigsidan): 2 am, minsk-am-v, am tills 4m kvar, minsk-am-h.
Varv 2 (rätsidan): 2 rm, minsk-rm-h, rm tills markören, minsk-rm-v, flytta markören, 1rm, flytta markören,
minsk-rm-h, rm tills 4m kvar, minsk-rm-v.
Upprepa dessa två varv tills du har ca 6 maskor kvar, maska av.`;

const TERMS = {
  "rm-h": {
    name: "minsk-rm-h",
    what: "En rät minskning: 2 maskor blir 1. Vanligast betyder \"h\" att minskningen lutar åt höger.",
    how: [
      "Stick in högra stickan i de 2 första maskorna på vänstra stickan samtidigt, framifrån, som när du stickar rätt.",
      "Sticka dem rätt som om de vore en enda maska.",
      "Nu har 2 maskor blivit 1."
    ]
  },
  "rm-v": {
    name: "minsk-rm-v",
    what: "En rät minskning: 2 maskor blir 1. Vanligast betyder \"v\" att minskningen lutar åt vänster.",
    how: [
      "Lyft 1 maska över till högra stickan som om du skulle sticka den rätt, men sticka den inte.",
      "Lyft nästa maska på samma sätt.",
      "Stick in vänstra stickan framifrån i de två lyfta maskorna.",
      "Sticka ihop dem rätt. Nu har 2 maskor blivit 1."
    ]
  },
  "am-v": { name: "minsk-am-v", purl: true },
  "am-h": { name: "minsk-am-h", purl: true }
};
const PURL_HOW = {
  a: ["Stick in högra stickan i de 2 första maskorna samtidigt, som när du stickar avigt.", "Sticka dem avigt som en maska. Nu har 2 maskor blivit 1."],
  b: ["Lyft 1 maska över till högra stickan som om du skulle sticka den rätt. Lyft nästa likadant.", "Flytta tillbaka båda till vänstra stickan.", "Sticka ihop dem avigt genom bakre maskbågen. Nu har 2 maskor blivit 1."]
};


/* The patterns on the list page. Each pattern keeps its own progress, saved under its id.
   Only the first has a guide so far; a new pattern gets an entry here and its own pages. */
const PATTERNS = [
  { id: "monster-1", title: "Första mönstret", sub: "116 eller 316 maskor · två varv som upprepas" }
];

const store = {
  get(k, d) { try { const v = localStorage.getItem("knit-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("knit-" + k, JSON.stringify(v)); } catch (e) {} }
};
// Progress saved before there was a pattern list belongs to the first pattern.
try {
  for (const k of ["size", "rows-116", "rows-316", "page"]) {
    const old = localStorage.getItem("knit-" + k), key = "knit-monster-1-" + k;
    if (old !== null && localStorage.getItem(key) === null) localStorage.setItem(key, old);
    localStorage.removeItem("knit-" + k);
  }
} catch (e) {}

const S = {
  view: "home",      // "home", "list" or "guide"
  pattern: null,
  size: 116,
  rows: {},          // rows finished, per size
  ticks: new Set(),  // step ids marked done
  page: "start",     // which page of the guide is open
  sheet: null,       // "counter", "ref" or a term key
  resetArmed: false
};
const pget = (k, d) => store.get(S.pattern + "-" + k, d);
const pset = (k, v) => store.set(S.pattern + "-" + k, v);
function openPattern(id) {
  S.pattern = id;
  S.size = pget("size", 116);
  S.rows = { 116: pget("rows-116", 0), 316: pget("rows-316", 0) };
  S.page = pget("page", "start");
  if (!PAGES.includes(S.page)) S.page = "start";
  S.ticks = new Set(pget("ticks", []));
}
const saveTicks = () => pset("ticks", [...S.ticks]);

const $ = s => document.querySelector(s);
const app = $("#app"), sheet = $("#sheet");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Stitch arithmetic, straight from the pattern: row 1 removes 2 (one decrease at each edge),
   row 2 removes 4 (one at each edge and one on each side of the centre stitch). */
function count(size, rowsDone) {
  const pairs = Math.floor(rowsDone / 2);
  return size - 6 * pairs - (rowsDone % 2 ? 2 : 0);
}
const rowsDone = () => S.rows[S.size];
const currentRow = () => (rowsDone() % 2 === 0 ? 1 : 2);
const repeatNo = () => Math.floor(rowsDone() / 2) + 1;

function term(key, label) { return `<button class="term" data-term="${key}">${esc(label || TERMS[key].name)}</button>`; }

function checkpoints(n) {
  const out = [];
  for (const k of [1, 2, 3, 5, 10, 15, 20, 30, 40, 50]) if (n - 6 * k >= 6) out.push([k, n - 6 * k]);
  return out;
}

/* The guide is split into pages, one stage each. Start is the overview; the rest show in the progress bar. */
const PAGES = ["start", "cast", "mark", "r1", "r2a", "r2b", "loop", "end"];
const ROW_PAGES = ["r1", "r2a", "r2b", "loop"];

/* How far the pattern goes, as written. Row 1 takes 1 stitch from each side of the centre stitch and needs 4 there
   (2 stitches and a decrease). Row 2 takes 2 from each side and needs 6 (2 stitches, the edge decrease and the one at
   the marker). An even cast-on gives sides of n/2 - 1 and n/2, so the smaller side decides. */
const minSide = (n, done) => n / 2 - 1 - 3 * Math.floor(done / 2) - (done % 2);
const canKnit = (n, done) => minSide(n, done) >= (done % 2 === 0 ? 4 : 6);
const rowsLeft = (n, done) => { let k = 0; while (canKnit(n, done + k) && count(n, done + k) > 6) k++; return k; };
const lastCount = n => count(n, rowsLeft(n, 0));
const finished = () => rowsLeft(S.size, rowsDone()) === 0;

function stepList(steps) {
  return `<ol class="steps">${steps.map((s, i) => `
    <li class="step${S.ticks.has(s.id) ? " done" : ""}" data-step="${s.id}" role="button" tabindex="0" aria-pressed="${S.ticks.has(s.id)}">
      <span class="no">${i + 1}</span>
      <span class="text">${s.text}${s.aside ? `<span class="aside">${s.aside}</span>` : ""}${s.inferred ? `<span class="inferred">Står inte i mönstret</span>` : ""}</span>
    </li>`).join("")}</ol>`;
}

/* Row diagrams. Each group is one step: its id, then its blocks.
   st: a few stitches, run: "knit until", dec: a decrease (2 stitches become 1), mid: the centre stitch, mk: a marker.
   Row 1 purls straight past the markers and the centre stitch, so they sit inside step 3.
   The diagram shows the order you knit in, not left and right on the needle. */
const ROW1 = [
  ["r1a", [["st", "2"]]],
  ["r1b", [["dec", "2→1"]]],
  ["r1c", [["run", "…"], ["mk"], ["mid", "1"], ["mk"], ["run", "…"]]],
  ["r1d", [["dec", "2→1"]]],
  ["r1e", [["st", "2"]]]
];
const ROW2 = [
  ["r2a", [["st", "2"]]],
  ["r2b", [["dec", "2→1"]]],
  ["r2c", [["run", "…"]]],
  ["r2d", [["dec", "2→1"]]],
  ["r2e", [["mk"]]],
  ["r2f", [["mid", "1"]]],
  ["r2g", [["mk"]]],
  ["r2h", [["dec", "2→1"]]],
  ["r2i", [["run", "…"]]],
  ["r2j", [["dec", "2→1"]]],
  ["r2k", [["st", "2"]]]
];
const block = ([k, l]) => `<span class="b b-${k}">${l || ""}</span>`;
const legend = plain => `<div class="legend"><span><i class="l-st"></i>${plain} maskor</span><span><i class="l-dec"></i>minskning, 2 blir 1</span><span><i class="l-mid"></i>mittmaskan</span><span><i class="l-mk"></i>markör</span></div>`;
function rowDiagram(groups, active, plain, caption) {
  let n = 0;
  const segs = groups.map(([id, blocks]) => {
    const on = active.includes(id);
    const grow = blocks.some(b => b[0] === "run");
    return `<div class="seg${on ? "" : " off"}${grow ? " grow" : ""}"${on ? ` data-for="${id}"` : ""}>
      <div class="seg-blocks">${blocks.map(block).join("")}</div>
      <span class="n">${on ? `<span>${++n}</span>` : ""}</span>
    </div>`;
  }).join("");
  return `<div class="diagram" aria-hidden="true"><p class="diagram-cap">${caption}</p><div class="strip">${segs}</div>${legend(plain)}</div>`;
}
// Done steps fade in the diagram too, and the next step to do is marked.
function refreshDiagram() {
  const next = [...app.querySelectorAll(".step")].map(el => el.dataset.step).find(id => !S.ticks.has(id));
  app.querySelectorAll(".seg[data-for]").forEach(g => {
    g.classList.toggle("done", S.ticks.has(g.dataset.for));
    g.classList.toggle("now", g.dataset.for === next);
  });
}

const NOTES = {
  last2: () => `<p class="note"><b>De 2 sista maskorna.</b> Mönstret slutar varje varv med en minskning när det är 4 maskor kvar. Då finns 2 maskor kvar som mönstret inte nämner. Guiden stickar dem, avigt på varv 1 och rätt på varv 2, så att båda kanterna får 2 maskor. Det är markerat med "Står inte i mönstret".</p>`,
  hv: () => `<p class="note"><b>-h och -v.</b> Mönstret förklarar inte förkortningarna. Har ditt mönster en förkortningslista gäller den före den här guiden. Alla fyra minskningar tar bort exakt 1 maska, så antalet maskor blir rätt oavsett. Det enda som skiljer är hur minskningen ser ut.</p>`,
  marker: () => `<p class="note"><b>Före markören.</b> Mönstret skriver "rm tills markören, minsk-rm-v, flytta markören". Minskningen kommer före markören flyttas, så den måste göras med de 2 maskorna närmast före markören. Därför stickar guiden rätt tills det är 2 maskor kvar före markören. Maskantalet blir detsamma.</p>`,
  mid: () => `<p class="note"><b>Mittmaskan.</b> ${S.size} är jämnt, så ena sidan av mittmaskan får en maska mer än den andra. Mittmaskan själv minskas aldrig. Markörerna följer med hela vägen.</p>`,
  end: () => `<p class="note"><b>Mot slutet.</b> Mönstret säger "ca 6 maskor". Varv 1 behöver minst 4 maskor på varje sida om mittmaskan och varv 2 minst 6, annars får minskningarna inte plats. Med ${S.size} maskor går det sista varvet att sticka när du har ${lastCount(S.size)} maskor kvar, efter ${rowsLeft(S.size, 0)} varv. Guiden säger till när det är dags att maska av.</p>`
};
const notes = keys => `<div class="block-label label">Bra att veta</div>${keys.map(k => NOTES[k]()).join("")}`;

function pageHead(eyebrow, title, intro) {
  const at = PAGES.indexOf(S.page);
  const bar = PAGES.slice(1).map((p, i) => `<span${i + 1 <= at ? ` class="on"` : ""}></span>`).join("");
  return `<div class="progress" aria-hidden="true">${bar}</div>
    <div class="eyebrow label">${eyebrow}</div>
    <h1 class="title">${title}</h1>
    ${intro ? `<p class="intro">${intro}</p>` : ""}`;
}

/* Where you are in the counting, on every knitting page. Tapping it opens the row counter. */
function status() {
  const n = S.size, done = rowsDone(), now = count(n, done), row = currentRow();
  const where = finished() ? "Klart att maska av" : `Upprepning ${repeatNo()} · varv ${row}`;
  const main = finished()
    ? `<b>${now}</b> maskor på stickan`
    : `<b>${now}</b> maskor nu, <b>${now - (row === 1 ? 2 : 4)}</b> när varvet är klart`;
  return `<button class="status" data-sheet="counter"><span class="status-top"><span>${where}</span><span>Varvräknare ›</span></span><span class="status-main">${main}</span></button>`;
}

function endWarning() {
  const n = S.size, now = count(n, rowsDone()), left = rowsLeft(n, rowsDone());
  if (left === 0) return `<div class="warn"><b>Dags att maska av.</b> Du har ${now} maskor kvar. Fler varv går inte att sticka som mönstret är skrivet, så närmare "ca 6" kommer du inte.</div>`;
  if (left <= 2) return `<div class="warn"><b>Nära slutet.</b> ${left === 1 ? "1 varv" : "2 varv"} till går att sticka som mönstret är skrivet. Sedan har du ${lastCount(n)} maskor kvar och det är dags att maska av.</div>`;
  return "";
}

const ROW2_FIRST = ["r2a", "r2b", "r2c", "r2d", "r2e", "r2f", "r2g"], ROW2_SECOND = ["r2h", "r2i", "r2j", "r2k"];
const PAGE_VIEWS = {
  start() {
    const n = S.size;
    const plan = [
      ["cast", `Lägg upp ${n} maskor`],
      ["mark", "Markera mittmaskan"],
      ["r1", "Varv 1 · avigsidan"],
      ["r2a", "Varv 2 · rätsidan"],
      ["loop", "Upprepa varv 1 och 2 tills ca 6 maskor är kvar"],
      ["end", "Maska av"]
    ];
    return `<h1 class="title">Mönstret, steg för steg</h1>
      <p class="intro">Hela mönstret är två varv som upprepas. Varje gång du stickat båda varven har du 6 maskor färre. Guiden tar ett moment i taget.</p>

      <div class="block-label label">Storlek</div>
      <div class="chips">${[116, 316].map(v => `<button class="chip" data-size="${v}" aria-pressed="${v === n}">${v} maskor</button>`).join("")}</div>

      <div class="block-label label">Så går det till</div>
      <ol class="plan-list">${plan.map(([p, t], i) => `<li><button data-page="${p}"><span class="no">${i + 1}</span><span class="txt">${esc(t)}</span></button></li>`).join("")}</ol>

      <div class="block-label label">Du behöver</div>
      <div class="ing"><span class="amt">${n}</span><span>maskor att lägga upp</span></div>
      <div class="ing"><span class="amt">2</span><span>maskmarkörer</span></div>
      <div class="ing"><span class="amt"></span><span>stickor och garn enligt mönstret</span></div>
      <div class="ing"><span class="amt"></span><span>gärna en säkerhetsnål att sätta på rätsidan, så du ser vilken sida som är vilken<span class="inferred" style="display:table;margin-top:6px">Står inte i mönstret</span></span></div>
      <p class="hint" style="margin-top:16px">Förkortningar och mönstret i original finns under Ordlista uppe till höger.</p>`;
  },

  cast() {
    return pageHead("Förberedelser", "Lägg upp maskor") +
      stepList([{ id: "p1", text: `Lägg upp <b>${S.size}</b> maskor.` }]);
  },

  mark() {
    const n = S.size, mid = n / 2;
    // Counted from the end you start counting at: mid - 1 stitches, the centre stitch, then n - mid stitches.
    const diagram = `<div class="diagram" aria-hidden="true"><p class="diagram-cap">Så sitter markörerna, räknat från kanten där du började räkna</p>
      <div class="strip">
        <div class="seg grow"><div class="seg-blocks">${block(["run", `${mid - 1} maskor`])}</div></div>
        <div class="seg"><div class="seg-blocks">${block(["mk"])}${block(["mid", `nr ${mid}`])}${block(["mk"])}</div></div>
        <div class="seg grow"><div class="seg-blocks">${block(["run", `${n - mid} maskor`])}</div></div>
      </div>
      <div class="legend"><span><i class="l-mid"></i>mittmaskan</span><span><i class="l-mk"></i>markör</span></div></div>`;
    return pageHead("Förberedelser", "Markera mittmaskan", "Mönstret minskar på båda sidor om en mittmaska. Markörerna visar var den är.") +
      diagram +
      stepList([
        { id: "p2", text: `Räkna fram till maska nummer <b>${mid}</b>. Det är mittmaskan.`,
          aside: `${n} är ett jämnt tal, så det finns ingen exakt mitt. Med maska ${mid} har ena sidan ${mid - 1} maskor och den andra ${n - mid}.`, inferred: true },
        { id: "p3", text: `Sätt en markör på varsin sida om mittmaskan, en före och en efter.` }
      ]) + notes(["mid"]);
  },

  r1() {
    return pageHead("Varv 1 · avigsidan", "Sticka varv 1", "Den sida som är vänd mot dig nu är avigsidan. På det här varvet minskar du 1 maska i varje kant.") +
      status() +
      rowDiagram(ROW1, ROW1.map(g => g[0]), "aviga", "Hela varvet i den ordning du stickar det →") +
      stepList([
        { id: "r1a", text: `Sticka <b>2</b> aviga maskor.` },
        { id: "r1b", text: `Gör ${term("am-v")}. Två maskor blir en.` },
        { id: "r1c", text: `Sticka avigt tills det är <b>4</b> maskor kvar på vänstra stickan.`, aside: "Flytta över markörerna till högra stickan när du kommer till dem. Mittmaskan stickas avigt som de andra." },
        { id: "r1d", text: `Gör ${term("am-h")}. Två maskor blir en.` },
        { id: "r1e", text: `Sticka de <b>2</b> sista maskorna avigt. Vänd arbetet.`, inferred: true }
      ]) + notes(["last2", "hv"]);
  },

  r2a() {
    return pageHead("Varv 2 · rätsidan · del 1 av 2", "Fram till mittmaskan", "Nu är framsidan vänd mot dig. Varv 2 minskar i båda kanterna och på varsin sida om mittmaskan. Här är första halvan.") +
      status() +
      rowDiagram(ROW2, ROW2_FIRST, "räta", "Hela varvet i den ordning du stickar det →") +
      stepList([
        { id: "r2a", text: `Sticka <b>2</b> räta maskor.` },
        { id: "r2b", text: `Gör ${term("rm-h")}. Två maskor blir en.` },
        { id: "r2c", text: `Sticka rätt tills det är <b>2</b> maskor kvar före den första markören.`, aside: "Mönstret skriver \"rm tills markören\", men minskningen som följer behöver de 2 maskorna närmast markören.", inferred: true },
        { id: "r2d", text: `Gör ${term("rm-v")} med de 2 maskorna före markören.` },
        { id: "r2e", text: `Flytta markören till högra stickan.` },
        { id: "r2f", text: `Sticka <b>1</b> rät maska. Det är mittmaskan.` },
        { id: "r2g", text: `Flytta markören till högra stickan.` }
      ]) + notes(["marker"]);
  },

  r2b() {
    return pageHead("Varv 2 · rätsidan · del 2 av 2", "Efter mittmaskan", "Fortsätt på samma varv, direkt efter den andra markören.") +
      status() +
      rowDiagram(ROW2, ROW2_SECOND, "räta", "Hela varvet i den ordning du stickar det →") +
      stepList([
        { id: "r2h", text: `Gör ${term("rm-h")} med de 2 första maskorna efter markören.` },
        { id: "r2i", text: `Sticka rätt tills det är <b>4</b> maskor kvar.` },
        { id: "r2j", text: `Gör ${term("rm-v")}. Två maskor blir en.` },
        { id: "r2k", text: `Sticka de <b>2</b> sista maskorna rätt. Vänd arbetet.`, inferred: true }
      ]) + notes(["last2"]);
  },

  loop() {
    const n = S.size, done = rowsDone(), pairs = Math.floor(done / 2), now = count(n, done);
    const title = pairs === 0 ? "Upprepa varv 1 och 2" : `Båda varven klara ${pairs} ${pairs === 1 ? "gång" : "gånger"}`;
    const intro = finished()
      ? `Nu ska du ha <b>${now}</b> maskor på stickan. Det är dags att maska av.`
      : rowsLeft(n, done) <= 2
        ? `Nu ska du ha <b>${now}</b> maskor på stickan.`
        : `Nu ska du ha <b>${now}</b> maskor på stickan. Sticka varv 1 och varv 2 om och om igen tills det är ungefär 6 maskor kvar.`;
    const early = !finished() && rowsLeft(n, done) <= 2 ? `<div class="chips"><button class="chip" data-page="end">Maska av nu</button></div>` : "";
    return pageHead("Upprepa", title, intro) +
      status() + endWarning() + early +
      `<div class="block-label label">Räkna dina maskor</div>
      <p class="hint">Så många maskor ska du ha efter att ha stickat båda varven så här många gånger. Varv 1 tar bort 2 maskor och varv 2 tar bort 4.</p>
      ${checkpoints(n).map(([k, c]) => `<div class="ing${k === pairs ? " current" : ""}"><span class="amt">${c}</span><span>efter ${k} ${k === 1 ? "gång" : "gånger"}${k === pairs ? " · du är här" : ""}</span></div>`).join("")}`;
  },

  end() {
    return pageHead("Avsluta", "Maska av") +
      stepList([{ id: "e1", text: `När du har ungefär <b>6</b> maskor kvar: maska av.`, aside: `Med ${S.size} maskor är det när du har ${lastCount(S.size)} maskor kvar. Se Bra att veta.` }]) + notes(["end"]);
  }
};

function guide() {
  return `${navBar("Mönster", `data-go="list"`, `<button class="top-link" data-sheet="ref">Ordlista</button>`)}
    <div class="scroll gutter page"><div class="wrap">${PAGE_VIEWS[S.page]()}</div></div>
    <div class="dock gutter"><div class="wrap dock-row">
      ${prevPage() ? `<button class="dock-back" data-prev aria-label="Tillbaka">${ICON.back}</button>` : ""}
      <button class="big" data-next>${nextAction()[0]}</button>
    </div></div>`;
}

function refSheet() {
  return `<div class="sheet-title">Ordlista</div>
    <div class="ing"><span class="amt">m</span><span>maska, maskor</span></div>
    <div class="ing"><span class="amt">rm</span><span>rätmaska, sticka rätt</span></div>
    <div class="ing"><span class="amt">am</span><span>avigmaska, sticka avigt</span></div>
    <div class="ing"><span class="amt">varv</span><span>en rad, från ena kanten till den andra</span></div>
    <div class="ing"><span class="amt">flytta markören</span><span>lyft över markören från vänstra till högra stickan</span></div>

function counterSheet() {
  const n = S.size, done = rowsDone(), row = currentRow();
  const now = count(n, done), after = now - (row === 1 ? 2 : 4);
  const finished = rowsLeft(n, done) === 0;
  const warn = endWarning();
  return `<div class="sheet-title">Varvräknare</div>
    <div class="group-label label"><span>Upprepning ${repeatNo()}</span></div>
    <div class="counter-row">${finished ? "Maska av" : `Varv ${row} · ${row === 1 ? "avigsidan" : "rätsidan"}`}</div>
    <div class="counter-side">${finished ? "" : row === 1 ? "Minska 1 maska i varje kant." : "Minska i varje kant och på varsin sida om mittmaskan."}</div>
    <div style="margin-top:14px">
      <div class="ing"><span class="amt">${now}</span><span>maskor på stickan nu</span></div>
      ${finished ? "" : `<div class="ing"><span class="amt">${after}</span><span>maskor när varvet är klart</span></div>`}
      <div class="ing"><span class="amt">${done}</span><span>varv stickade hittills, storlek ${n}</span></div>
    </div>
    ${warn}
    <button class="big-btn" data-count="next" ${finished ? "disabled" : ""}>Varv ${row} klart</button>
    <div class="small-btns">
      <button class="chip" data-count="undo" ${done === 0 ? "disabled" : ""}>Ångra ett varv</button>
      <button class="chip" data-count="reset">${S.resetArmed ? "Tryck igen för att nollställa" : "Nollställ"}</button>
    </div>`;
}

function termSheet(key) {
  const t = TERMS[key];
  if (!t.purl) {
    return `<div class="sheet-title">${esc(t.name)}</div>
      <p class="muted">${esc(t.what)}</p>
      <ol class="how" style="margin-top:12px">${t.how.map(h => `<li>${esc(h)}</li>`).join("")}</ol>
      <p class="muted">Står det något annat i ditt mönsters förkortningslista, följ den.</p>`;
  }
  return `<div class="sheet-title">${esc(t.name)}</div>
    <p class="muted">En avig minskning: 2 maskor blir 1. Mönstret säger inte vilken avig minskning \"-v\" och \"-h\" står för. Här är de två vanliga. Kolla ditt mönsters förkortningslista om det finns en.</p>
    <div class="group-label label"><span>A · 2 aviga tillsammans</span></div>
    <ol class="how">${PURL_HOW.a.map(h => `<li>${esc(h)}</li>`).join("")}</ol>
    <div class="group-label label"><span>B · lyft, lyft, avigt bakre maskbågen</span></div>
    <ol class="how">${PURL_HOW.b.map(h => `<li>${esc(h)}</li>`).join("")}</ol>
    <p class="muted">Osäker? Båda tar bort exakt 1 maska, så maskantalet blir rätt med vilken som helst. A är enklast. Det som skiljer är bara hur kanten ser ut.</p>`;
}

/* ---------- Navigation ---------- */
/* What the big button at the bottom does on each page. Finishing a row also moves the row counter on,
   but only if the counter is on that row, so stepping back and forward never counts a row twice. */
function finishRow(r) {
  if (currentRow() !== r || finished()) return;
  setRows(rowsDone() + 1);
  for (const id of [...S.ticks]) if (id.startsWith("r" + r)) S.ticks.delete(id);
  saveTicks();
}
const NEXT = {
  start: ["Börja: lägg upp", () => go("cast")],
  cast: ["Nästa: markera mitten", () => go("mark")],
  mark: ["Nästa: varv 1", () => go("r1")],
  r1: ["Varv 1 klart", () => { finishRow(1); go(finished() ? "loop" : "r2a"); }],
  r2a: ["Nästa: andra halvan", () => go("r2b")],
  r2b: ["Varv 2 klart", () => { finishRow(2); go("loop"); }],
  loop: () => finished() ? ["Nästa: maska av", () => go("end")] : ["Sticka varv 1 igen", () => go("r1")],
  end: ["Klar", () => show("list", "b")]
};
const nextAction = () => typeof NEXT[S.page] === "function" ? NEXT[S.page]() : NEXT[S.page];
const PREV = { cast: "start", mark: "cast", r1: () => rowsDone() >= 2 ? "loop" : "mark", r2a: "r1", r2b: "r2a", loop: "r2b", end: "loop" };
const prevPage = () => typeof PREV[S.page] === "function" ? PREV[S.page]() : PREV[S.page];

const setPage = page => { S.page = page; pset("page", page); };
function go(page) {
  const dir = PAGES.indexOf(page) < PAGES.indexOf(S.page) ? "b" : "f";
  transition(dir, () => setPage(page));
}
const DEPTH = { home: 0, list: 1, guide: 2 };
function show(view, dir) {
  transition(dir || (DEPTH[view] < DEPTH[S.view] ? "b" : "f"), () => { S.view = view; });
}

/* After the row counter changes, a knitting page follows it to the row you are on. */
function followCounter() {
  if (S.view !== "guide" || !ROW_PAGES.includes(S.page)) return;
  setPage(finished() ? "loop" : currentRow() === 1 ? "r1" : "r2a");
}

function setRows(v) {
  S.rows[S.size] = Math.max(0, v);
  pset("rows-" + S.size, S.rows[S.size]);
}

/* ---------- Render ---------- */
function draw() {
  app.innerHTML = S.view === "home" ? home() : S.view === "list" ? list() : guide();
  if (S.view === "guide") { refreshDiagram(); requestWake(); } else releaseWake();
}

const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
// Ends entrance animations on a timer, so content is never left invisible if the browser stalls them.
let settleTimer = null;
function settleApp() {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => { app.classList.remove("enter-f", "enter-b"); app.classList.add("settled"); }, 550);
}
// Swaps to the new page at once and fades it in. dir is "f" (deeper or onward) or "b" (back).
function transition(dir, change) {
  app.classList.remove("enter-f", "enter-b", "settled");
  change();
  draw();
  if (reducedMotion()) return;
  void app.offsetWidth;
  app.classList.add("enter-" + dir);
  settleApp();
}

/* ---------- Sheet ---------- */
function sheetBody() {
  return S.sheet === "counter" ? counterSheet() : S.sheet === "ref" ? refSheet() : termSheet(S.sheet);
}
let sheetTimer = null;
function openSheet(kind) {
  const wasOpen = !sheet.hidden && !sheet.classList.contains("closing");
  S.sheet = kind; S.resetArmed = false;
  sheet.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
    <div class="scroll gutter"><div class="wrap">${sheetBody()}</div></div>
    <div class="sheet-foot gutter"><div class="wrap"><button class="big" data-close>Stäng</button></div></div>
  </div>`;
  if (wasOpen) return;
  clearTimeout(sheetTimer);
  sheet.classList.remove("closing", "settled");
  sheet.hidden = false;
  sheetTimer = setTimeout(() => sheet.classList.add("settled"), 400);
}
// Redraws the open sheet in place, keeping its scroll position.
function refreshSheet() {
  const sc = sheet.querySelector(".scroll"), top = sc ? sc.scrollTop : 0;
  sheet.querySelector(".scroll .wrap").innerHTML = sheetBody();
  sheet.querySelector(".scroll").scrollTop = top;
}
function closeSheet() {
  if (sheet.hidden) return;
  S.sheet = null; S.resetArmed = false;
  clearTimeout(sheetTimer);
  sheet.classList.remove("settled");
  sheet.classList.add("closing");
  sheetTimer = setTimeout(() => { sheet.hidden = true; sheet.innerHTML = ""; sheet.classList.remove("closing"); }, reducedMotion() ? 0 : 200);
}

/* ---------- Keep the screen on while knitting, where the browser allows it ---------- */
let wakeLock = null;
async function requestWake() {
  if (wakeLock || !("wakeLock" in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) {}
}
function releaseWake() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.view === "guide") requestWake(); });

/* ---------- Taps ---------- */
function toggleStep(el) {
  const id = el.dataset.step;
  S.ticks.has(id) ? S.ticks.delete(id) : S.ticks.add(id);
  el.classList.toggle("done", S.ticks.has(id));
  el.setAttribute("aria-pressed", S.ticks.has(id));
  saveTicks();
  refreshDiagram();
}

document.addEventListener("click", e => {
  if (e.target === sheet) return closeSheet();
  const termEl = e.target.closest("[data-term]");
  if (termEl) { e.stopPropagation(); return openSheet(termEl.dataset.term); }
  const stepEl = e.target.closest("[data-step]");
  if (stepEl) return toggleStep(stepEl);
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if ("appUpdate" in d) return updateApp(t);
  if (d.go) return show(d.go);
  if (d.pattern) { openPattern(d.pattern); return show("guide", "f"); }
  if (d.page) return go(d.page);
  if ("next" in d) return nextAction()[1]();
  if ("prev" in d) { const p = prevPage(); if (p) go(p); return; }
  if (d.sheet) return openSheet(d.sheet);
  if ("close" in d) return closeSheet();
  if (d.size) { S.size = Number(d.size); pset("size", S.size); S.ticks.clear(); saveTicks(); return draw(); }
  if (d.count) {
    const a = d.count;
    if (a === "next") {
      const finishedRow = currentRow();
      setRows(rowsDone() + 1);
      for (const id of [...S.ticks]) if (id.startsWith("r" + finishedRow)) S.ticks.delete(id);
      saveTicks();
      S.resetArmed = false;
    } else if (a === "undo") { setRows(rowsDone() - 1); S.resetArmed = false; }
    else if (a === "reset") {
      if (S.resetArmed) { setRows(0); S.resetArmed = false; for (const id of [...S.ticks]) if (id[0] === "r") S.ticks.delete(id); saveTicks(); }
      else S.resetArmed = true;
    }
    if (a !== "reset" || !S.resetArmed) { followCounter(); draw(); }
    refreshSheet();
  }
});
document.addEventListener("keydown", e => {
  if (!sheet.hidden && e.key === "Escape") return closeSheet();
  const stepEl = e.target.closest && e.target.closest("[data-step]");
  if (stepEl && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleStep(stepEl); }
});

/* ---------- Update: fetch the newest version past the browser's cache, then reload ---------- */
// If there's no connection the app stays as it is.
function updateWipe(x, y, opening) {
  const wipe = document.createElement("div");
  wipe.className = "update-wipe";
  // Starts below the header, so the header and the status bar above it stay as they are.
  const bar = app.querySelector(".top-bar");
  const top = bar ? Math.round(bar.getBoundingClientRect().bottom) : 0;
  wipe.style.top = `${top}px`;
  const r = Math.ceil(Math.hypot(innerWidth, innerHeight));
  const circle = document.createElement("b");
  circle.style.cssText = `left:${x - r}px;top:${y - top - r}px;width:${r * 2}px;height:${r * 2}px;transform:scale(${opening ? 1 : 0})`;
  const word = document.createElement("span");
  word.textContent = "KNIT";
  word.style.opacity = opening ? 1 : 0;
  wipe.append(circle, word);
  document.body.appendChild(wipe);
  const ease = "cubic-bezier(.65,0,.35,1)";
  const scales = [{ transform: "scale(0)" }, { transform: "scale(1)" }], fades = [{ opacity: 0 }, { opacity: 1 }];
  circle.animate(opening ? scales : [...scales].reverse(), { duration: opening ? 420 : 380, easing: ease });
  word.animate(opening ? fades : [...fades].reverse(), opening ? { duration: 200, delay: 140, fill: "backwards" } : { duration: 140 });
  return wipe;
}
function closeWipe(x, y) {
  const closing = updateWipe(x, y, false);
  setTimeout(() => closing.remove(), 400);
}
async function updateApp(button) {
  button.classList.add("updating");
  button.disabled = true;
  const box = button.getBoundingClientRect(), x = Math.round(box.left + box.width / 2), y = Math.round(box.top + box.height / 2);
  const motion = !reducedMotion();
  const wipe = motion ? updateWipe(x, y, true) : null;
  try {
    if (motion) await new Promise(done => setTimeout(done, 520));
    const files = [location.href.split("#")[0], "apple-touch-icon.png"];
    await Promise.all(files.map(url => fetch(url, { cache: "reload" }).then(res => { if (!res.ok) throw new Error(url); })));
    if (motion) try { sessionStorage.setItem("updateWipe", JSON.stringify([x, y, Math.round(app.querySelector(".top-bar").getBoundingClientRect().bottom)])); } catch (e) {}
    location.reload();
  } catch (e) {
    if (wipe) { wipe.remove(); closeWipe(x, y); }
    button.classList.remove("updating");
    button.disabled = false;
  }
}

/* ---------- Swipe right to go back, as on iOS ---------- */
// The previous page sits underneath from the first movement. The current page follows the finger
// and the one below drifts in at a slower pace. In the guide, back is the previous step.
const canGoBack = () => S.view !== "home";
function stepBack() {
  if (S.view === "guide" && prevPage()) setPage(prevPage());
  else S.view = S.view === "guide" ? "list" : "home";
  draw();
}
const PARALLAX = .28;
let swipe = null, swallowClick = false, swipeTop = null, swipeState = null, swipeBusy = false;
function liftPage() {
  swipeState = { view: S.view, page: S.page };
  clearTimeout(settleTimer);
  app.classList.remove("enter-f", "enter-b");
  app.classList.add("settled", "swiping");
  swipeTop = document.createElement("div");
  swipeTop.className = "view swipe-top";
  const scrolls = [...app.querySelectorAll(".scroll")].map(el => el.scrollTop);
  while (app.firstChild) swipeTop.appendChild(app.firstChild);
  document.body.appendChild(swipeTop);
  swipeTop.querySelectorAll(".scroll").forEach((el, i) => { el.scrollTop = scrolls[i]; });
  stepBack();
}
function moveSwipe(dx) {
  swipeTop.style.transform = `translateX(${dx}px)`;
  app.style.transform = `translateX(${-(1 - dx / innerWidth) * PARALLAX * 100}%)`;
}
function finishSwipe(commit, dx) {
  const top = swipeTop, state = swipeState;
  swipeTop = null; swipeState = null;
  const remaining = commit ? innerWidth - dx : dx;
  const ms = Math.round(Math.max(120, Math.min(260, remaining / innerWidth * 320)));
  const curve = `${ms}ms cubic-bezier(.2,.8,.2,1)`;
  top.style.transition = `transform ${curve}`;
  app.style.transition = `transform ${curve}`;
  void top.offsetWidth;
  top.style.transform = commit ? "translateX(100%)" : "translateX(0)";
  app.style.transform = commit ? "translateX(0)" : `translateX(${-PARALLAX * 100}%)`;
  swipeBusy = true;
  setTimeout(() => {
    if (!commit) {
      S.view = state.view;
      if (state.view === "guide") setPage(state.page);
      const scrolls = [...top.querySelectorAll(".scroll")].map(el => el.scrollTop);
      app.innerHTML = "";
      while (top.firstChild) app.appendChild(top.firstChild);
      app.querySelectorAll(".scroll").forEach((el, i) => { el.scrollTop = scrolls[i]; });
      if (S.view === "guide") requestWake();
    }
    top.remove();
    app.style.transition = app.style.transform = "";
    app.classList.remove("swiping");
    swipeBusy = false;
  }, ms + 20);
}
document.addEventListener("touchstart", e => {
  swipe = null;
  if (swipeBusy || e.touches.length !== 1 || !sheet.hidden || !canGoBack()) return;
  const t = e.touches[0];
  swipe = { x: t.clientX, y: t.clientY, dx: 0, active: false, lastX: t.clientX, lastTime: Date.now(), speed: 0 };
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (!swipe) return;
  const t = e.touches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  if (!swipe.active) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (dx <= 0 || Math.abs(dy) >= dx) { swipe = null; return; }
    swipe.active = true;
    swipe.x = t.clientX;
    liftPage();
  }
  swipe.dx = Math.max(0, t.clientX - swipe.x);
  const now = Date.now();
  if (now > swipe.lastTime) swipe.speed = (t.clientX - swipe.lastX) / (now - swipe.lastTime);
  swipe.lastX = t.clientX; swipe.lastTime = now;
  moveSwipe(swipe.dx);
}, { passive: true });
function endSwipe(cancelled) {
  if (!swipe || !swipe.active) { swipe = null; return; }
  const { dx } = swipe, speed = Date.now() - swipe.lastTime > 80 ? 0 : swipe.speed;
  swipe = null;
  swallowClick = true;
  setTimeout(() => { swallowClick = false; }, 300);
  // Where the page would end up from its current speed decides the outcome, so a quick flick counts.
  finishSwipe(!cancelled && dx + speed * 180 > innerWidth * .5, dx);
}
document.addEventListener("touchend", () => endSwipe(false), { passive: true });
document.addEventListener("touchcancel", () => endSwipe(true), { passive: true });
document.addEventListener("click", e => {
  if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; }
}, true);

/* ---------- Start ---------- */
draw();
settleApp();
try {
  const point = JSON.parse(sessionStorage.getItem("updateWipe"));
  sessionStorage.removeItem("updateWipe");
  if (point) {
    // Starts shrinking only when the new page is done loading and drawing, so nothing competes with the motion.
    let started = false;
    const begin = () => {
      if (started) return;
      started = true;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        closeWipe(point[0], point[1]);
        document.documentElement.classList.remove("wipe-hold");
      }));
    };
    const ready = document.fonts ? document.fonts.ready : Promise.resolve();
    addEventListener("load", () => ready.then(begin));
    setTimeout(begin, 1200);
    setTimeout(() => document.documentElement.classList.remove("wipe-hold"), 1600);
  }
} catch (e) {}
</script>
</body>
</html>
